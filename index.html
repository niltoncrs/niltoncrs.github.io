			.card {
				position: absolute;
				top: 50%;
				left: 50%;
				width: 500px;
				height: 300px; 
				margin: -150px -250px;
				float: left;
				perspective: 500px;
			}

			.content {
				position: absolute;
				width: 100%;
				height: 100%;
				box-shadow: 0 0 15px rgba(0,0,0,0.1);
				transition: transform 1s;
				transform-style: preserve-3d;
			}

			.card:hover .content {
				transform: rotateY( 180deg ) ;
				transition: transform 0.5s;
			}

			.front {
				position: absolute;
				height: 100%;
				width: 100%;
				line-height: 300px;

				text-align: center;
				font-size: 60px;
				border-radius: 5px;
				backface-visibility: hidden;
				background: #bfffcb;
			}

			.back {
				position: absolute;
				height: 100%;
				width: 100%;
				/* background: white; */

				border-radius: 5px;
				backface-visibility: hidden;
				background: #377e47;
				color: #bfffcb;
				transform: rotateY( 180deg );
			}

				font-weight: 300;
